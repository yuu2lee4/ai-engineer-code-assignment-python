[project]
name = "contract-review-interview"
version = "0.1.0"
description = "Interview coding task for the contract intake review agent."
readme = "README.md"
authors = [{ name = "Interview Team" }]
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.1.0",
    "langchain-openai>=0.0.8",
    "langgraph>=0.0.50",
    "pydantic>=2.5",
    "typer>=0.9",
    "streamlit>=1.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
